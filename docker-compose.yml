networks:
  frontend:
    name: keycloak_frontend
    driver: bridge
  backend:
    name: keycloak_backend
    driver: bridge
    internal: true # Isola o banco de dados completamente, sem rota de saida para a internet
    # Nomes fixos (em vez de deixar o Compose prefixar com o nome da pasta):
    # o label "traefik.docker.network" do servico keycloak precisa apontar
    # pro nome REAL da rede, e isso so' e' estavel se o repositorio puder
    # ser clonado em qualquer pasta sem quebrar o roteamento (achado real -
    # ver docs/scripts-referencia.md#traefik).

volumes:
  postgres_data:
    driver: local
  portainer_data:
    driver: local

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  kc_admin_password:
    file: ./secrets/kc_admin_password.txt

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Banco de Dados PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: keycloak_db
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak_user}
      # Imagem oficial do Postgres suporta _FILE nativamente (diferente do Keycloak)
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tuning de performance do PostgreSQL para carga institucional
    # (assume VM com min. 8 vCPU / 16GB RAM - ver docs/00-pre-requisitos.md)
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-keycloak_user} -d $${POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    # Sem "ports:" - Postgres so e alcancavel dentro da rede "backend" (internal: true)

  # ---------------------------------------------------------------------------
  # Servidor Keycloak (Build Customizado & Otimizado)
  # ---------------------------------------------------------------------------
  keycloak:
    # Imagem publicada pelo pipeline de CI (.github/workflows/ci.yml) no
    # GitHub Container Registry - "docker compose pull" usa esta imagem.
    # O bloco "build" abaixo continua existindo como fallback: "docker
    # compose build" / "deploy.sh --build" builda localmente com a MESMA
    # tag, para homologacao/dev sem depender do registry.
    image: ${KEYCLOAK_IMAGE:-ghcr.io/yurythx/keycloak-sso}:${KEYCLOAK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keycloak_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    environment:
      # Conexao com o Banco de Dados
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak_user}
      # Resolvido em senha real pelo docker-entrypoint-secrets.sh (ver Dockerfile)
      KC_DB_PASSWORD_FILE: /run/secrets/postgres_password

      # Admin Bootstrap (criado apenas na primeira inicializacao do realm master)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kc_admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password

      # Configuracao de Dominio, HTTP e Proxy
      KC_HOSTNAME: ${KC_HOSTNAME} # Ex: https://sso.papermoon.cloud
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_PROXY_TRUSTED_ADDRESSES: ${PROXY_TRUSTED_ADDRESSES:-172.16.0.0/12}

      # Certificados de Confianca (CA do Active Directory / LDAPS)
      KC_TRUSTSTORE_PATHS: /opt/keycloak/certs

      # Management interface (health/metrics) - fica em porta separada (9000),
      # NUNCA publicada no host nem proxiada publicamente pelo Traefik.
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Tuning de Conexoes e Memoria da JVM
      KC_DB_POOL_INITIAL_SIZE: 20
      KC_DB_POOL_MAX_SIZE: 100
      JAVA_OPTS_APPEND: "-Xms2048m -Xmx4096m -XX:+UseG1GC"
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
    secrets:
      - postgres_password
      - kc_admin_password
    volumes:
      - ./certs:/opt/keycloak/certs:ro
      # Tema visual customizado (logo/cores da prefeitura) - ver
      # docs/tema-visual.md. "themes/" no container so tem um README por
      # padrao (temas nativos ficam empacotados em jars), entao montar
      # aqui nao esconde/substitui o keycloak.v2 nem nenhum tema nativo.
      - ./themes:/opt/keycloak/themes:ro
    # Injecao de FQDN/IP do Domain Controller do Active Directory
    extra_hosts:
      - "${AD_DC_HOSTNAME}:${AD_DC_IP}"
    # O Keycloak nao publica portas no host! Comunicacao exclusiva via Traefik na rede frontend.
    healthcheck:
      # bash explicito (nao depende de /bin/sh ser bash) contra a management port 9000,
      # acessada apenas internamente pelo Docker healthcheck - nunca exposta ao host.
      test:
        - "CMD-SHELL"
        - >
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000;
          echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          cat <&3 | grep -q "200 OK"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 4g
    cpus: 2.0
    logging: *default-logging
    # Roteamento e TLS via Traefik (ver servico "traefik" abaixo). Em
    # homologacao (sem docker-compose.prod.yml), o router pede TLS sem
    # certresolver - o Traefik serve seu proprio certificado autoassinado
    # interno automaticamente, sem precisar gerar/gerenciar nenhum .pem.
    labels:
      - "traefik.enable=true"
      # Rede explicita: com o keycloak em 2 redes (frontend + backend), o
      # provider Docker do Traefik pode escolher o IP errado pra rotear
      # (mapas em Go nao garantem ordem) - sem isso o roteamento para de
      # funcionar silenciosamente depois de alguns minutos (achado real,
      # ver docs/scripts-referencia.md#traefik).
      - "traefik.docker.network=keycloak_frontend"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      # HTTP -> HTTPS (redirect permanente)
      - "traefik.http.routers.keycloak-web.rule=Host(`${KC_HOSTNAME_FQDN}`)"
      - "traefik.http.routers.keycloak-web.entrypoints=web"
      - "traefik.http.routers.keycloak-web.middlewares=https-redirect@docker"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      # HTTPS
      - "traefik.http.routers.keycloak.rule=Host(`${KC_HOSTNAME_FQDN}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.middlewares=security-headers@docker"
      # Paridade com os headers que o nginx.conf antigo injetava. SAMEORIGIN
      # (nao DENY) de proposito: o Keycloak usa um iframe same-origin pro
      # "status iframe" de SSO/SLO.
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"

  # ---------------------------------------------------------------------------
  # Proxy Reverso Traefik (Unico Ponto de Entrada Externo)
  # ---------------------------------------------------------------------------
  # TLS automatico: autoassinado interno em homologacao (padrao), ou real
  # via Let's Encrypt em producao (docker-compose.prod.yml, ativado pelo
  # setup.sh). Versao travada em v3.7.9 (nao "latest"): testada e validada
  # contra o Docker Engine deste projeto - versoes v3.3 mais antigas tem
  # um bug real de negociacao de API com daemons Docker recentes (ver
  # docs/scripts-referencia.md#traefik).
  traefik:
    image: traefik:v3.7.9
    container_name: keycloak_traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=false"
      - "--ping=true"
    networks:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Portainer (opcional - gerenciador visual do Docker)
  # ---------------------------------------------------------------------------
  # So sobe com o profile "portainer" ativo (deploy.sh le ENABLE_PORTAINER
  # do .env e ativa/desativa automaticamente - ver docs/scripts-referencia.md).
  #
  # ATENCAO: o Portainer precisa de acesso de LEITURA E ESCRITA ao socket
  # do Docker do host para funcionar - isso equivale a acesso root na VM
  # (quem controla o Docker controla tudo, inclusive o container do
  # Postgres). Por isso o bind padrao e' 127.0.0.1 (so acessivel via SSH
  # tunnel/VPN), nunca exposto direto na internet por padrao.
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    profiles: ["portainer"]
    networks:
      - frontend
    ports:
      - "${PORTAINER_BIND:-127.0.0.1}:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    # Sem healthcheck: a imagem oficial do Portainer e' baseada em "scratch"
    # (sem shell, sem wget/curl) - nao ha nada executavel para um CMD/
    # CMD-SHELL rodar dentro do container. deploy.sh trata a ausencia de
    # healthcheck como "container rodando" (ver scripts/deploy.sh, wait_healthy).
    logging: *default-logging
